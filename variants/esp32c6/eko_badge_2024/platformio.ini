[env:meshtastic_eko_badge_2024]
extends = esp32c6_base
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/f89295f6a617a8ec611f4bd4eb2f998799dc5dc8.zip
board = eko_badge_2024
board_level = extra
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-c6
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Electronic Cats EKOPARTY 2024 (experimental TX 10dBm)

build_flags =
  ${esp32c6_base.build_flags}
  -D EKO_BADGE_2024
  -I variants/esp32c6/eko_badge_2024
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; The variant owns the OLED with a compact UI, not the generic BaseUI.
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_POWER_FSM=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1

build_src_filter =
  ${esp32c6_base.build_src_filter}
  -<mesh/http/>
  -<motion/>

lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2

lib_deps =
  ${esp32c6_base.lib_deps}
  https://github.com/adafruit/Adafruit_NeoPixel/archive/1.15.5.zip
